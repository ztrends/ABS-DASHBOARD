<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>ABS DASHBOARD — Admin</title>
<style>
:root{--bg:#080b14;--panel:#111725;--panel2:#171e2e;--text:#f5f7fb;--muted:#8d98ad;--line:#273047;--accent:#7c5cff;--blue:#1877f2;--danger:#ef5350;--ok:#35c98a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18213a 0,#080b14 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.login{min-height:100vh;display:grid;place-items:center}.login-card,.panel{background:rgba(17,23,37,.94);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px #0006;backdrop-filter:blur(14px)}
.login-card{width:min(430px,100%);padding:30px}.brand{font-weight:900;letter-spacing:.08em;font-size:13px;color:#a99bff}.login-card h1{margin:8px 0}.muted{color:var(--muted)}label{display:block;margin:16px 0 7px;font-size:13px;color:var(--muted)}input,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#0b101c;color:var(--text);outline:none}textarea{min-height:90px;resize:vertical}input:focus,textarea:focus{border-color:var(--accent)}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;background:var(--accent);color:#fff}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.danger{background:#4a2024;color:#ffb6b6}.btn.ok{background:#123c31;color:#8ff0c7}.btn.blue{background:#123a70;color:#9bc8ff}.full{width:100%}
.top{padding:22px 0 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#080b14eF;backdrop-filter:blur(16px);z-index:5}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:24px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.stat small{display:block;color:var(--muted);margin-bottom:7px}.stat b{font-size:25px}
.grid{display:grid;grid-template-columns:1.25fr .95fr;gap:16px;margin:16px 0}.panel{padding:18px}.panel h2{font-size:17px;margin:0 0 14px}.user,.ad{border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0;background:#0c111d}.userhead{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800}.mobile,.sub{font-size:12px;color:var(--muted);margin-top:4px}.badge{font-size:11px;border-radius:99px;padding:5px 8px;background:#18372e;color:#8ff0c7;height:max-content}.verify{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:900;margin-left:5px;vertical-align:middle}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:25px;text-align:center;color:var(--muted)}.ad img{width:100%;aspect-ratio:3/1;object-fit:cover;border-radius:10px;background:#080b14;margin-top:10px}.adtitle{font-weight:800}.ad-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{width:min(500px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:none;border:0;color:var(--muted);font-size:24px}.msg{min-height:20px;margin-top:10px;font-size:13px}.preview{margin-top:10px;display:none}.preview img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow:auto;margin:8px 0 16px}.tab{white-space:nowrap}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);gap:9px}.grid{grid-template-columns:1fr}.top{padding-top:calc(16px + env(safe-area-inset-top));}.toprow{align-items:stretch;flex-direction:column}.actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%;min-height:44px}.wrap{width:min(100% - 16px,1180px)}.panel{padding:14px;border-radius:18px}.login{padding:16px}.login-card{padding:22px;border-radius:20px}.title{font-size:21px}.stats .stat{padding:13px}.stat b{font-size:21px}.userhead{align-items:flex-start}.userhead .badge{white-space:nowrap}.row{display:grid;grid-template-columns:1fr;}.row .btn{width:100%;min-height:44px}.ad-actions{display:grid;grid-template-columns:1fr 1fr}.ad-actions .btn{min-height:44px}.section-title{align-items:flex-start;flex-direction:column}.section-title .btn{width:100%;min-height:44px}.modal{padding:10px;align-items:end}.modalbox{width:100%;max-height:92vh;border-radius:20px 20px 0 0;padding:16px}.modalbox input,.modalbox textarea{font-size:16px}.modalbox .btn{min-height:44px}}
</style>
</head>
<body>
<section id="login" class="login">
  <div class="login-card">
    <div class="brand" style="display:flex;align-items:center;gap:10px"><img src="../assets/abs-logo.png" alt="ABS" style="width:34px;height:34px;object-fit:contain;border-radius:9px"><span>ABS DASHBOARD</span></div><h1>Admin Panel</h1><p class="muted">Secure administration · /admin/</p>
    <form id="loginForm">
      <label>Username</label><input id="adminUser" autocomplete="username" required>
      <label>Password</label><input id="adminPass" type="password" autocomplete="current-password" required>
      <button class="btn full" style="margin-top:18px">LOGIN</button><div id="loginMsg" class="msg"></div>
    </form>
  </div>
</section>

<section id="app" class="hidden">
<header class="top"><div class="wrap toprow">
  <div><div class="brand" style="display:flex;align-items:center;gap:10px"><img src="../assets/abs-logo.png" alt="ABS" style="width:34px;height:34px;object-fit:contain;border-radius:9px"><span>ABS DASHBOARD</span></div><div class="title">Admin Control Center</div></div>
  <div class="actions"><button class="btn secondary" onclick="refreshAdmin()">↻ Refresh</button><button class="btn danger" onclick="adminLogout()">Logout</button></div>
</div></header>
<main class="wrap">
  <div class="stats">
    <div class="stat"><small>Total Users</small><b id="userCount">0</b></div>
    <div class="stat"><small>Feedback</small><b id="feedbackCount">0</b></div>
    <div class="stat"><small>Active Ads</small><b id="adCount">0</b></div>
    <div class="stat"><small>Verified Users</small><b id="verifiedCount">0</b></div><div class="stat"><small>Premium Requests</small><b id="requestCount">0</b></div>
  </div>
  <div class="grid">
    <section class="panel"><div class="section-title"><h2>Registered Users</h2><button class="btn" onclick="openCreateUser()">+ Create Account</button></div><div id="users"></div></section>
    <section class="panel"><div class="section-title"><h2>Advertisements</h2><button class="btn" onclick="openAdModal()">+ Add Ad</button></div><div id="ads"></div></section>
  </div>
  <section class="panel" style="margin:16px 0"><div class="section-title"><h2>Premium Requests</h2><span id="requestCountLabel" class="muted"></span></div><div id="premiumRequests"></div></section>
  <section class="panel" style="margin:16px 0"><div class="section-title"><h2>Feedback</h2></div><div id="feedback"></div></section>
</main>
</section>

<div id="modal" class="hidden modal"><div class="modalbox">
  <div class="modalhead"><h2 id="modalTitle">Manage</h2><button class="close" onclick="closeModal()">×</button></div>
  <div id="modalBody"></div>
</div></div>
<script src="admin.js?v=2"></script>
</body>
</html>
