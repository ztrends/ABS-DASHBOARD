
name: Build ABS DASHBOARD APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: cd frontend && npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Prepare web files
        run: |
          cd frontend
          rm -rf www && mkdir -p www
          cp index.html www/index.html
          for d in assets css js admin; do
            if [ -d "$d" ]; then cp -R "$d" www/; fi
          done
          cp manifest.json www/manifest.json 2>/dev/null || true
          cp sw.js www/sw.js 2>/dev/null || true

      - name: Initialize Capacitor
        run: |
          cd frontend
          npx cap init "ABS DASHBOARD" "com.absdashboard.app" --web-dir www
          npx cap add android
          npx cap sync android

     
      - name: Generate ABS Android launcher icon
        run: |
          cd frontend
          if [ -f assets/abs-icon.png ]; then
            cp assets/abs-icon.png assets/icon.png
          else
            echo "ERROR: abs-icon.png not found in frontend/assets/"
            ls -la assets/
            exit 1
          fi
          npx capacitor-assets generate --android


      - name: Add safe Android back handling
        run: |
          cd frontend/android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/absdashboard/app/MainActivity.java')
          if p.exists():
              s=p.read_text()
              if 'handleAndroidBack' not in s:
                  i=s.rfind('}')
                  method=''' 
              @Override
              public void onBackPressed() {
                  getBridge().getWebView().evaluateJavascript("window.handleAndroidBack ? String(window.handleAndroidBack()) : 'false'", value -> {
                      if (!"\\"true\\"".equals(value)) MainActivity.super.onBackPressed();
                  });
              }
          '''
                  p.write_text(s[:i]+method+s[i:])
          PY

      - name: Ensure Android and Maven Central repositories
        run: |
          cd frontend/android
          python3 - <<'PYFIX'
          from pathlib import Path
          import re
          p = Path('settings.gradle')
          s = p.read_text()
          # Add reliable Maven Central endpoints to dependency repositories, without changing plugin repositories.
          repos = ['google()', 'mavenCentral()', 'maven { url = uri("https://repo1.maven.org/maven2") }', 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }']
          if 'dependencyResolutionManagement' in s:
              start = s.index('dependencyResolutionManagement')
              before, tail = s[:start], s[start:]
              m = re.search(r'repositories\s*\{', tail)
              if m:
                  pos = m.end()
                  existing = tail[pos:pos+600]
                  for line in reversed(repos):
                      if line.strip() not in existing:
                          tail = tail[:pos] + '\n        ' + line.strip() + tail[pos:]
                  s = before + tail
          p.write_text(s)
          PYFIX
      - name: Fix duplicate Kotlin JDK7/JDK8 classes
        run: |
          cd frontend/android
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          block = '''
          // Kotlin stdlib 1.8+ includes the JDK7/JDK8 classes; exclude legacy split artifacts.
          configurations.configureEach {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          '''
          marker = 'module: "kotlin-stdlib-jdk7"'
          if marker not in s:
              s += "\n\n" + block
              p.write_text(s)
          PYFIX

      - name: Build APK
        run: cd frontend/android && chmod +x gradlew && ./gradlew clean assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ABS-DASHBOARD-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ABS DASHBOARD APK ${{ github.run_number }}
          make_latest: true
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

