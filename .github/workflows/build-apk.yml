
name: Build ABS DASHBOARD APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: cd frontend && npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets jspdf@2.5.1

      - name: Prepare web files
        run: |
          cd frontend
          rm -rf www && mkdir -p www
          echo "window.ABS_APP_VERSION = \"${GITHUB_RUN_NUMBER}\";" > js/app-version.js
          mkdir -p js/vendor
          cp node_modules/jspdf/dist/jspdf.umd.min.js js/vendor/jspdf.umd.min.js
          cp index.html www/index.html
          for d in assets css js admin; do
            if [ -d "$d" ]; then cp -R "$d" www/; fi
          done
          cp manifest.json www/manifest.json 2>/dev/null || true
          cp sw.js www/sw.js 2>/dev/null || true

      - name: Initialize Capacitor
        run: |
          cd frontend
          npx cap init "ABS DASHBOARD" "com.absdashboard.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set increasing Android app version
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd frontend/android
          python3 - <<'PYVER'
          from pathlib import Path
          import os, re
          p = Path('app/build.gradle')
          s = p.read_text()
          version = int(os.environ['VERSION_CODE'])
          code, n1 = re.subn(r'(?m)(\bversionCode\s+)\d+', lambda m: m.group(1) + str(version), s, count=1)
          name, n2 = re.subn(r'(?m)(\bversionName\s+)"[^"]+"', lambda m: m.group(1) + '"1.0.' + str(version) + '"', code, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Could not safely set Android versionCode/versionName')
          p.write_text(name)
          print('Android versionCode=' + str(version) + ', versionName=1.0.' + str(version))
          PYVER

      - name: Stamp APK build version
        env:
          ABS_BUILD_VERSION: ${{ github.run_number }}
        run: |
          cd frontend
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['ABS_BUILD_VERSION']
          p = Path('www/index.html')
          html = p.read_text()
          marker = '<head>'
          if marker not in html:
              raise SystemExit('HTML head element not found')
          html = html.replace(marker, marker + '\n<script>window.ABS_APP_VERSION = "' + version + '";</script>', 1)
          p.write_text(html)
          # Stamp runtime version too; app-version.js loads after the inline HTML
          # version and otherwise overrides it with the checked-in fallback.
          version_file = Path('www/js/app-version.js')
          version_file.write_text('window.ABS_APP_VERSION = "' + version + '";\n')
          # Bust the WebView asset cache for the version script.
          html = p.read_text()
          html = re.sub(r"js/app-version\.js(?:\?[^\"']*)?", "js/app-version.js?v=" + version, html, count=1)
          p.write_text(html)
          print('Stamped ABS APK runtime version', version)
          PY
          npx cap copy android

      - name: Generate ABS Android launcher icon
        run: |
          cd frontend
          if [ -f assets/abs-icon.png ]; then
            cp assets/abs-icon.png assets/icon.png
          else
            echo "ERROR: abs-icon.png not found in frontend/assets/"
            ls -la assets/
            exit 1
          fi
          npx capacitor-assets generate --android


      - name: Add safe Android back handling
        run: |
          cd frontend/android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/absdashboard/app/MainActivity.java')
          if p.exists():
              s=p.read_text()
              if 'handleAndroidBack' not in s:
                  i=s.rfind('}')
                  method=''' 
              @Override
              public void onBackPressed() {
                  getBridge().getWebView().evaluateJavascript("window.handleAndroidBack ? String(window.handleAndroidBack()) : 'false'", value -> {
                      if (!"\\"true\\"".equals(value)) super.onBackPressed();
                  });
              }
          '''
                  p.write_text(s[:i]+method+s[i:])
          PY

      - name: Add native Android share sheet bridge
        run: |
          cd frontend/android
          python3 - <<'PYSHARE'
          from pathlib import Path
          p = Path('app/src/main/java/com/absdashboard/app/MainActivity.java')
          s = p.read_text()
          imports = ['import android.content.Intent;', 'import android.os.Bundle;', 'import android.webkit.JavascriptInterface;']
          first_line_end = s.find('\n')
          if first_line_end < 0:
              raise SystemExit('MainActivity package declaration missing')
          additions = ''.join('\n' + item for item in imports if item not in s)
          if additions:
              s = s[:first_line_end] + additions + s[first_line_end:]
          if 'class AbsShareBridge' not in s:
              i = s.rfind('}')
              block = '''
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(new AbsShareBridge(), "AbsShare");
                  }
              }

              private class AbsShareBridge {
                  @JavascriptInterface
                  public void share(String title, String text, String url) {
                      final String shareTitle = (title == null || title.trim().isEmpty()) ? "Share" : title;
                      String body = text == null ? "" : text.trim();
                      if (url != null && !url.trim().isEmpty() && !body.contains(url.trim())) {
                          body = body.isEmpty() ? url.trim() : body + "\\n" + url.trim();
                      }
                      final String shareBody = body;
                      runOnUiThread(() -> {
                          Intent sendIntent = new Intent(Intent.ACTION_SEND);
                          sendIntent.setType("text/plain");
                          sendIntent.putExtra(Intent.EXTRA_SUBJECT, shareTitle);
                          sendIntent.putExtra(Intent.EXTRA_TEXT, shareBody);
                          startActivity(Intent.createChooser(sendIntent, shareTitle));
                      });
                  }
              }
              '''
              s = s[:i] + block + '\n' + s[i:]
          p.write_text(s)
          PYSHARE

      - name: Add native PDF save bridge for Android Downloads
        run: |
          cd frontend/android
          python3 - <<'PYPDF'
          from pathlib import Path
          p = Path('app/src/main/java/com/absdashboard/app/MainActivity.java')
          s = p.read_text()
          imports = [
              'import android.content.ContentValues;',
              'import android.net.Uri;',
              'import android.os.Build;',
              'import android.os.Environment;',
              'import android.provider.MediaStore;',
              'import android.util.Base64;',
              'import java.io.OutputStream;'
          ]
          first_line_end = s.find('\n')
          if first_line_end < 0:
              raise SystemExit('MainActivity package declaration missing')
          existing = s
          additions = ''.join('\n' + item for item in imports if item not in existing)
          if additions:
              s = s[:first_line_end] + additions + s[first_line_end:]
          if 'addJavascriptInterface(new AbsFileBridge(), "AbsFile")' not in s:
              marker = 'getBridge().getWebView().addJavascriptInterface(new AbsShareBridge(), "AbsShare");'
              if marker not in s:
                  raise SystemExit('AbsShare bridge hook not found in MainActivity')
              s = s.replace(marker, marker + '\n                      getBridge().getWebView().addJavascriptInterface(new AbsFileBridge(), "AbsFile");', 1)
          if 'class AbsFileBridge' not in s:
              i = s.rfind('}')
              block = '''

              private class AbsFileBridge {
                  @JavascriptInterface
                  public String savePdfBase64(String encoded, String filename) {
                      try {
                          if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                              return "ERROR:Android 10 or newer is required for direct Downloads saving.";
                          }
                          byte[] bytes = Base64.decode(encoded, Base64.DEFAULT);
                          if (bytes == null || bytes.length == 0) return "ERROR:PDF data is empty.";
                          String safeName = (filename == null ? "ABS-Statement.pdf" : filename).replaceAll("[^A-Za-z0-9._-]", "_");
                          if (!safeName.toLowerCase().endsWith(".pdf")) safeName += ".pdf";
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, safeName);
                          values.put(MediaStore.Downloads.MIME_TYPE, "application/pdf");
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri == null) return "ERROR:Could not create a Downloads file.";
                          try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                              if (out == null) return "ERROR:Could not write the PDF file.";
                              out.write(bytes);
                              out.flush();
                          }
                          return "OK";
                      } catch (Exception e) {
                          return "ERROR:" + (e.getMessage() == null ? "PDF could not be saved." : e.getMessage());
                      }
                  }
              }
              '''
              s = s[:i] + block + '\n' + s[i:]
          p.write_text(s)
          PYPDF

      - name: Add native Android in-app APK downloader and installer
        run: |
          cd frontend/android
          python3 - <<'PYUPDATE'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/absdashboard/app/MainActivity.java')
          s = p.read_text()
          imports = [
              'import android.app.DownloadManager;',
              'import android.content.BroadcastReceiver;',
              'import android.content.Context;',
              'import android.content.IntentFilter;',
              'import android.content.pm.PackageManager;',
              'import android.net.Uri;',
              'import android.os.Build;',
              'import android.os.Environment;',
              'import android.provider.Settings;',
              'import android.webkit.JavascriptInterface;',
              'import android.widget.Toast;',
          ]
          first_line_end = s.find('\n')
          if first_line_end < 0:
              raise SystemExit('MainActivity package declaration missing')
          additions = ''.join('\n' + item for item in imports if item not in s)
          if additions:
              s = s[:first_line_end] + additions + s[first_line_end:]
          marker = 'getBridge().getWebView().addJavascriptInterface(new AbsShareBridge(), "AbsShare");'
          if marker not in s:
              raise SystemExit('AbsShare bridge registration not found')
          updater_marker = 'getBridge().getWebView().addJavascriptInterface(new AbsUpdaterBridge(), "AbsUpdater");'
          if updater_marker not in s:
              s = s.replace(marker, marker + '\\n        ' + updater_marker, 1)
          receiver_registration = '''
                      if (apkDownloadReceiver != null) {
                          IntentFilter apkFilter = new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE);
                          if (Build.VERSION.SDK_INT >= 33) {
                              registerReceiver(apkDownloadReceiver, apkFilter, Context.RECEIVER_EXPORTED);
                          } else {
                              registerReceiver(apkDownloadReceiver, apkFilter);
                          }
                      }'''
          if 'registerReceiver(apkDownloadReceiver' not in s:
              s = s.replace(marker, marker + receiver_registration, 1)
          if 'class AbsUpdaterBridge' not in s:
              i = s.rfind('}')
              block = '''
              private Uri pendingApkInstallUri;

              private final BroadcastReceiver apkDownloadReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (!DownloadManager.ACTION_DOWNLOAD_COMPLETE.equals(intent.getAction())) return;
                      long completedId = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L);
                      DownloadManager manager = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                      DownloadManager.Query query = new DownloadManager.Query().setFilterById(completedId);
                      try (android.database.Cursor cursor = manager.query(query)) {
                          if (cursor == null || !cursor.moveToFirst()) return;
                          int status = cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                          if (status != DownloadManager.STATUS_SUCCESSFUL) {
                              Toast.makeText(MainActivity.this, "APK download failed. Please try again.", Toast.LENGTH_LONG).show();
                              return;
                          }
                          Uri apkUri = manager.getUriForDownloadedFile(completedId);
                          if (apkUri == null) {
                              Toast.makeText(MainActivity.this, "Downloaded APK could not be opened.", Toast.LENGTH_LONG).show();
                              return;
                          }
                          installDownloadedApk(apkUri);
                      } catch (Exception error) {
                          Toast.makeText(MainActivity.this, "Could not open the downloaded update.", Toast.LENGTH_LONG).show();
                      }
                  }
              };

              private void installDownloadedApk(Uri apkUri) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                          !getPackageManager().canRequestPackageInstalls()) {
                          pendingApkInstallUri = apkUri;
                          Intent settingsIntent = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + getPackageName()));
                          startActivityForResult(settingsIntent, 991);
                          Toast.makeText(this, "Allow ABS Dashboard to install updates, then return to the app.", Toast.LENGTH_LONG).show();
                          return;
                      }
                      Intent installIntent = new Intent(Intent.ACTION_VIEW);
                      installIntent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                      installIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(installIntent);
                  } catch (Exception error) {
                      Toast.makeText(this, "Open Downloads and tap the ABS DASHBOARD APK to install.", Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 991 && pendingApkInstallUri != null) {
                      Uri apkUri = pendingApkInstallUri;
                      pendingApkInstallUri = null;
                      if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O || getPackageManager().canRequestPackageInstalls()) {
                          installDownloadedApk(apkUri);
                      } else {
                          Toast.makeText(this, "Update not installed. Allow ABS Dashboard to install unknown apps in Settings.", Toast.LENGTH_LONG).show();
                      }
                  }
              }

              private class AbsUpdaterBridge {
                  @JavascriptInterface
                  public void downloadAndInstall(String url, String version) {
                      if (url == null || !url.startsWith("https://github.com/ztrends/ABS-DASHBOARD/releases/download/")) return;
                      runOnUiThread(() -> {
                          try {
                              String safeVersion = (version == null ? "latest" : version).replaceAll("[^0-9A-Za-z._-]", "");
                              DownloadManager manager = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                              DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                              request.setTitle("ABS DASHBOARD update");
                              request.setDescription("Downloading app version " + safeVersion);
                              request.setMimeType("application/vnd.android.package-archive");
                              request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "ABS-DASHBOARD-v" + safeVersion + ".apk");
                              manager.enqueue(request);
                              Toast.makeText(MainActivity.this, "Update downloading. You will be asked to install it when the download finishes.", Toast.LENGTH_LONG).show();
                          } catch (Exception error) {
                              Toast.makeText(MainActivity.this, "Could not start APK download. Please try again.", Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
              '''
              s = s[:i] + block + '\n' + s[i:]
          else:
              raise SystemExit('Unexpected pre-existing AbsUpdaterBridge; refusing to overwrite it')
          p.write_text(s)

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if permission not in m:
              m = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + permission, m, count=1)
              manifest.write_text(m)
          PYUPDATE
      - name: Ensure Android and Maven Central repositories
        run: |
          cd frontend/android
          python3 - <<'PYFIX'
          from pathlib import Path
          import re
          p = Path('settings.gradle')
          s = p.read_text()
          # Add reliable Maven Central endpoints to dependency repositories, without changing plugin repositories.
          repos = ['google()', 'mavenCentral()', 'maven { url = uri("https://repo1.maven.org/maven2") }', 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }']
          if 'dependencyResolutionManagement' in s:
              start = s.index('dependencyResolutionManagement')
              before, tail = s[:start], s[start:]
              m = re.search(r'repositories\s*\{', tail)
              if m:
                  pos = m.end()
                  existing = tail[pos:pos+600]
                  for line in reversed(repos):
                      if line.strip() not in existing:
                          tail = tail[:pos] + '\n        ' + line.strip() + tail[pos:]
                  s = before + tail
          p.write_text(s)
          PYFIX
      - name: Fix duplicate Kotlin JDK7/JDK8 classes
        run: |
          cd frontend/android
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          block = '''
          // Kotlin stdlib 1.8+ includes the JDK7/JDK8 classes; exclude legacy split artifacts.
          configurations.configureEach {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          '''
          marker = 'module: "kotlin-stdlib-jdk7"'
          if marker not in s:
              s += "\n\n" + block
              p.write_text(s)
          PYFIX

      - name: Build APK
        run: cd frontend/android && chmod +x gradlew && ./gradlew clean assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ABS-DASHBOARD-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ABS DASHBOARD APK ${{ github.run_number }}
          make_latest: true
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

